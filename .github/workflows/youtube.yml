name: Refresh YouTube list

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_youtube.py --limit 5
      - name: Commit if changed
        run: |
          # Ignore the "updated:" stamp so an unchanged channel doesn't create a commit every day
          if git diff -U0 -- _data/youtube.yml | grep -E '^[+-][^+-]' | grep -vq '^[+-]updated:'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -am "Refresh YouTube list"
            git push
          else
            echo "No new YouTube items."
          fi
