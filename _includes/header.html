<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/skillberry-logo.png' | relative_url }}" alt="" width="36" height="36">
      <span>Skillberry</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.nav %}
      {%- assign active = page.url | slice: 0, item.url.size %}
      <a href="{{ item.url | relative_url }}"{% if active == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
      <a class="nav-gh" href="{{ site.github_url }}" aria-label="Skillberry on GitHub">{% include icon-github.svg %}</a>
    </nav>
    <div class="theme-switch" role="group" aria-label="Color theme">
      <button type="button" data-theme-value="light" aria-pressed="false" title="Light">☀️<span class="sr-only">Light</span></button>
      <button type="button" data-theme-value="system" aria-pressed="true" title="System">💻<span class="sr-only">System</span></button>
      <button type="button" data-theme-value="dark" aria-pressed="false" title="Dark">🌙<span class="sr-only">Dark</span></button>
    </div>
  </div>
</header>
