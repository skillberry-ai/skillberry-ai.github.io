<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Skillberry — coming soon</title>
  <link rel="icon" type="image/png" href="/skillberry-logo.png">
  <style>
    :root { --bg: #f7f4ec; --text: #1c2340; --muted: #5a6180; --accent: #34407a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1420; --text: #e6e9f5; --muted: #9aa3c0; --accent: #9aa8ff; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
      background: var(--bg); color: var(--text); text-align: center;
      font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    img { width: 180px; height: 180px; border-radius: 24px; }
    h1 { font-size: 1.8rem; margin: 1.25rem 0 0.25rem; }
    p { color: var(--muted); margin: 0.25rem 0; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <img src="/skillberry-logo.png" alt="Skillberry logo">
    <h1>🫐 Coming soon</h1>
    <p>The Skillberry site is being prepared. 🤖</p>
    <p>Meanwhile, find us on <a href="https://github.com/skillberry-ai">GitHub</a>.</p>
  </main>
</body>
</html>
